  :root {
    color-scheme: light;
    --bg: #fdf8f4;
    --panel: #ffffff;
    --ink: #3b3336;
    --ink-soft: #7d7378;
    --ink-faint: #aaa0a4;
    --line: #f0e7e3;
    --line-strong: #ded1cd;
    --accent: #d4818b;
    --baby: #d4818b;
    --visit: #7ea8c4;
    --edwina: #9a89c4;
    --loretta: #5aa39a;
    --work: #8fb59a;
    --family: #e0a566;
    --today: #e0705f;
    --band: rgba(212,129,139,.035);
    --wood: #c9a582;
    --hero-a: #fceff1;
    --hero-b: #f6f1e9;
    --baby-d: #c06070;
    --wood-d: #a8815c;
    --visit-d: #5b8ba8;
    --family-d: #c98a45;
    --shadow: 0 1px 2px rgba(89,62,68,.05), 0 8px 24px rgba(89,62,68,.06);
    --radius: 14px;
  }


  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 90px; }
  h1 { font-family: "Simply Playful", ui-rounded, "Trebuchet MS", sans-serif;
       font-size: 34px; font-weight: 400; margin: 0 0 4px; letter-spacing: .01em; }
  .lede { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 14px; }

  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
          color: var(--ink-faint); font-weight: 600; margin-bottom: 5px; }
  input, select {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 150px; min-width: 0; }

  button { font: inherit; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--accent); color: #fff; padding: 10px 18px; font-weight: 500; }
  .primary:disabled { opacity: .55; cursor: default; }
  .ghost { background: var(--panel); border-color: var(--line-strong); color: var(--ink-soft); padding: 7px 12px; font-size: 13px; }
  .ghost:hover { border-color: var(--accent); color: var(--ink); }
  .danger { background: transparent; border-color: transparent; color: var(--today); padding: 6px 8px; font-size: 12.5px; }
  .danger:hover { text-decoration: underline; }

  .ev { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--panel); }
  .ev-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ev-top .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .ev-top .name { font-weight: 600; font-size: 14px; flex: 1 1 auto; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
  .opt { border-left: 3px solid var(--line-strong); padding: 10px 0 10px 12px; margin: 10px 0; }
  .opt h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; }
  .span-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 8px; }
  .span-row > div { flex: 1 1 140px; }

  .bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line-strong);
         padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
         margin: 0 -20px -90px; }
  .msg { font-size: 13px; }
  .msg.err { color: var(--today); }
  .msg.ok { color: var(--work); }

  #login { max-width: 380px; margin: 60px auto; }
  #app { display: none; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Edit dates</h1>
    <p class="lede">Sign in to change the timeline.</p>
    <div class="card">
      <form id="login-form">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <div style="margin-top:14px; display:flex; align-items:center; gap:12px;">
          <button class="primary" type="submit">Sign in</button>
          <span class="msg" id="login-msg"></span>
        </div>
      </form>
      <p class="hint">Changes appear on the timeline straight away.</p>
    </div>
  </div>

  <div id="app">
    <h1>Edit dates</h1>
    <p class="lede" id="app-lede">Add, change or remove dates, then save.</p>

    <div class="card">
      <label>Cheryle's maternity leave</label>
      <div class="row">
        <div><label for="cl-start">Start</label><input id="cl-start" type="date"></div>
        <div><label for="cl-end">End</label><input id="cl-end" type="date"></div>
      </div>
    </div>

    <h3 style="font-size:14px;margin:22px 0 10px;">Timeline entries</h3>
    <div id="events"></div>
    <button class="ghost" id="add-event">+ Add an entry</button>

    <h3 style="font-size:14px;margin:26px 0 10px;">Still to be decided</h3>
    <div id="tbd"></div>
    <button class="ghost" id="add-tbd">+ Add one</button>

    <div class="bar">
      <button class="primary" id="save">Save changes</button>
      <a class="ghost" href="index.html" style="text-decoration:none;padding:7px 12px;">View timeline</a>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</div>

<script>
const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? "http://127.0.0.1:8787"
  : (window.BT_API || "");

const CATS = [
  ["baby", "Baby"], ["visit", "Nida & Rae"], ["edwina", "Edwina"],
  ["loretta", "Loretta"], ["work", "Work & leave"], ["family", "Family"],
];
const COLOUR = { baby:"--baby", visit:"--visit", edwina:"--edwina",
                 loretta:"--loretta", work:"--work", family:"--family" };

let token = sessionStorage.getItem("bt_token") || "";
let data = null;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
function say(node, text, kind) { node.textContent = text; node.className = "msg" + (kind ? " " + kind : ""); }

/* ---------- auth ---------- */

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("login-msg");
  say(msg, "Checking…");
  try {
    const r = await fetch(`${API}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value }),
    });
    const body = await r.json();
    if (!r.ok) return say(msg, body.error || "Sign-in failed.", "err");
    token = body.token;
    sessionStorage.setItem("bt_token", token);
    $("pw").value = "";
    say(msg, "");
    await start();
  } catch {
    say(msg, "Can't reach the server. Is it running?", "err");
  }
});

async function start() {
  const r = await fetch(`${API}/api/data`, { cache: "no-store" });
  data = await r.json();
  $("login").style.display = "none";
  $("app").style.display = "block";
  if (data.updatedAt) {
    $("app-lede").textContent =
      `Last saved ${new Date(data.updatedAt).toLocaleString("en-US",
        { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" })}.`;
  }
  $("cl-start").value = data.cheryleLeave.start;
  $("cl-end").value = data.cheryleLeave.end;
  drawEvents();
  drawTbd();
}

/* ---------- editor ---------- */

function field(labelText, value, oninput, type = "text") {
  const input = el("input", { type, value: value ?? "" });
  input.addEventListener("input", () => oninput(input.value));
  return el("div", {}, [el("label", { textContent: labelText }), input]);
}

function spanRow(span, onRemove, canRemove) {
  const row = el("div", { className: "span-row" });
  row.append(
    field("From", span.start, (v) => (span.start = v), "date"),
    field("To", span.end, (v) => (span.end = v), "date"),
  );
  if (canRemove) {
    const b = el("button", { className: "danger", type: "button", textContent: "Remove" });
    b.addEventListener("click", onRemove);
    row.append(b);
  }
  return row;
}

function drawEvents() {
  const host = $("events");
  host.textContent = "";
  data.events.forEach((ev, i) => host.append(eventCard(ev, i)));
}

function eventCard(ev, i) {
  const card = el("div", { className: "ev" });

  const top = el("div", { className: "ev-top" });
  const dot = el("span", { className: "dot" });
  dot.style.background = `var(${COLOUR[ev.cat] || "--ink-faint"})`;
  const kind = ev.options ? "switchable options" : ev.date ? "single day" : "date range";
  const up = el("button", { className: "ghost", type: "button", textContent: "↑", title: "Move up" });
  const down = el("button", { className: "ghost", type: "button", textContent: "↓", title: "Move down" });
  const del = el("button", { className: "danger", type: "button", textContent: "Delete" });
  up.addEventListener("click", () => { if (i > 0) { [data.events[i-1], data.events[i]] = [data.events[i], data.events[i-1]]; drawEvents(); } });
  down.addEventListener("click", () => { if (i < data.events.length-1) { [data.events[i+1], data.events[i]] = [data.events[i], data.events[i+1]]; drawEvents(); } });
  del.addEventListener("click", () => {
    if (confirm(`Delete "${ev.label}"? This can't be undone once you save.`)) {
      data.events.splice(i, 1); drawEvents();
    }
  });
  top.append(dot, el("span", { className: "name", textContent: ev.label || "(untitled)" }),
             el("span", { className: "kind", textContent: kind }), up, down, del);
  card.append(top);

  const r1 = el("div", { className: "row" });
  r1.append(field("Name", ev.label, (v) => { ev.label = v; top.querySelector(".name").textContent = v || "(untitled)"; }));
  r1.append(field("Small print (optional)", ev.sub, (v) => (ev.sub = v || undefined)));

  const sel = el("select");
  for (const [val, text] of CATS) sel.append(el("option", { value: val, textContent: text, selected: ev.cat === val }));
  sel.addEventListener("change", () => { ev.cat = sel.value; dot.style.background = `var(${COLOUR[ev.cat]})`; });
  r1.append(el("div", {}, [el("label", { textContent: "Colour" }), sel]));
  card.append(r1);

  if (ev.options) {
    ev.options.forEach((opt, oi) => {
      const box = el("div", { className: "opt" });
      box.append(el("h4", { textContent: `Option ${opt.n}` }));
      const orow = el("div", { className: "row" });
      orow.append(field("Option name", opt.label, (v) => (opt.label = v)));
      if (opt.spans.length > 1)
        orow.append(field("Label for the gap", opt.gapLabel, (v) => (opt.gapLabel = v || undefined)));
      box.append(orow);
      opt.spans.forEach((sp, si) => box.append(spanRow(sp,
        () => { opt.spans.splice(si, 1); drawEvents(); }, opt.spans.length > 1)));
      const add = el("button", { className: "ghost", type: "button", textContent: "+ Add another stretch" });
      add.addEventListener("click", () => { opt.spans.push({ start: "", end: "" }); drawEvents(); });
      box.append(add);
      card.append(box);
    });
  } else if (ev.date) {
    const r = el("div", { className: "row" });
    r.append(field("Date", ev.date, (v) => (ev.date = v), "date"));
    card.append(r);
  } else {
    const r = el("div", { className: "row" });
    r.append(field("From", ev.start, (v) => (ev.start = v), "date"),
             field("To", ev.end, (v) => (ev.end = v), "date"));
    card.append(r);
  }
  return card;
}

function drawTbd() {
  const host = $("tbd");
  host.textContent = "";
  data.tbd = data.tbd || [];
  data.tbd.forEach((t, i) => {
    const card = el("div", { className: "ev" });
    const row = el("div", { className: "row" });
    row.append(field("What", t.what, (v) => (t.what = v)));
    row.append(field("Note (optional)", t.hint, (v) => (t.hint = v || undefined)));
    const del = el("button", { className: "danger", type: "button", textContent: "Delete" });
    del.addEventListener("click", () => { data.tbd.splice(i, 1); drawTbd(); });
    row.append(el("div", { style: "flex:0 0 auto" }, [el("label", { innerHTML: "&nbsp;" }), del]));
    card.append(row);
    host.append(card);
  });
}

$("add-event").addEventListener("click", () => {
  const n = Date.now().toString(36);
  data.events.push({ id: `e-${n}`, label: "New entry", cat: "baby", start: "", end: "" });
  drawEvents();
  $("events").lastElementChild.scrollIntoView({ block: "center" });
});
$("add-tbd").addEventListener("click", () => { (data.tbd = data.tbd || []).push({ what: "" }); drawTbd(); });

/* ---------- save ---------- */

$("save").addEventListener("click", async () => {
  const msg = $("msg"), btn = $("save");
  data.cheryleLeave = { start: $("cl-start").value, end: $("cl-end").value };
  btn.disabled = true;
  say(msg, "Saving…");
  try {
    const r = await fetch(`${API}/api/data`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(data),
    });
    const body = await r.json();
    if (r.status === 401) {
      sessionStorage.removeItem("bt_token");
      say(msg, "Your session expired — reload and sign in again.", "err");
    } else if (!r.ok) {
      say(msg, body.error || "Save failed.", "err");
    } else {
      say(msg, "Saved. The timeline is updated.", "ok");
      setTimeout(() => say(msg, ""), 4000);
    }
  } catch {
    say(msg, "Can't reach the server.", "err");
  } finally {
    btn.disabled = false;
  }
});

if (token) start().catch(() => { sessionStorage.removeItem("bt_token"); });
</script>
</body>
